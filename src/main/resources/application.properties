# server port
server.port=8080
# server root address
server.servlet.context-path=/

# MYSQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bh_wms?characterEncoding=utf-8&serverTimezone=GMT%2B8&allowMultiQueries=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# mybatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=io.ukoko.bhwms.entity
mybatis.mapper-locations=classpath:mapper/*.xml

# swagger
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# log
logging.charset.console=utf-8
logging.level.root=INFO

# thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=html
spring.thymeleaf.encoding=UTF-8

# web static cache
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-store=false

# file upload size
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# json time format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# timezone
spring.jackson.time-zone=GMT+8