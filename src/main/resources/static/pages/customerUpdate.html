<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百惠wms仓库</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

<div class="layui-fluid">
    <form class="layui-form" style="margin-top: 10px;">
        <input type="hidden" name="customerId" id="customerId">
        <div class="layui-form-item">
            <label class="layui-form-label">客户名</label>
            <div class="layui-input-block">
                <input type="text" id="customerName" name="customerName" required  lay-verify="required" placeholder="客户名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">联系人</label>
            <div class="layui-input-block">
                <input type="text" id="customerLeader" name="customerLeader" required  lay-verify="required" placeholder="联系人" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" id="customerTel" name="customerTel" required  lay-verify="required" placeholder="手机号" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input type="email" id="customerEmail" name="customerEmail" required  lay-verify="required" placeholder="邮箱" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">客户地址</label>
            <div class="layui-input-block">
                <input type="text" id="customerAddress" name="customerAddress" required  lay-verify="required" placeholder="客户地址" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">客户级别</label>
            <div class="layui-input-block">
                <select id="levelId" name="levelId" lay-verify="required"></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">客户来源</label>
            <div  class="layui-input-block">
                <select id="sourceId" name="sourceId" lay-verify="required"></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">客户行业</label>
            <div  class="layui-input-block">
                <select id="industryId" name="industryId" lay-verify="required"></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">是否有效</label>
            <div class="layui-input-block">
                <input type="radio" name="isDelete" value="1" title="有效" checked>
                <input type="radio" name="isDelete" value="0" title="无效">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-block">
                <input type="text" id="createTime" name="createTime"  placeholder="创建时间"  class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn  layui-btn-normal" lay-submit lay-filter="edit">更新客户</button>
            </div>
        </div>
    </form>
</div>

<script src="../layui/layui.js"></script>
<script src="../js/xm-select.js"></script>
<script>

    layui.use(["jquery","form","laydate","layer"],function () {
        let $ = layui.jquery;
        let form = layui.form;
        let laydate = layui.laydate;
        let layer = layui.layer;

        /*创建时间*/
        laydate.render({
            elem: '#createTime', //指定元素
            type:'datetime',/* 年月日时分秒 */
            theme:'#2F4056 '
        });

        /* 处理请求地址 */
        let url=location.href;
        //获取参数
        let param = url.substring(url.lastIndexOf("?")+1,url.length);
        let params = param.split("&");
        let obj={};
        for (let i = 0; i < params.length; i++) {
            let item = params[i].split("=");
            obj[item[0]]=item[1];
        }
        if(obj.isDelete==1){
            $('input[name="isDelete"][value="1"]').attr("checked","checked");
        }else{
            $('input[name="isDelete"][value="0"]').attr("checked","checked");
        }
        //刷新
        form.render("radio");

        /* 来源列表 */
        $.getJSON("/getSourceList",function (d){
            if(d.code!=0){
                layer.msg(d.msg);
            }else{
                let list = d.obj;
                let s="";
                for (let i = 0; i < list.length; i++) {
                    if(obj.sourceId==list[i].sourceId){
                        s+='<option selected value="'+list[i].sourceId+'">'+list[i].sourceName+'</option>';
                    }else{
                        s+='<option value="'+list[i].sourceId+'">'+list[i].sourceName+'</option>';
                    }

                }
                //设置到列表位置
                $("#sourceId").html(s);
                //刷新
                form.render("select");
            }
        });
        /* 级别列表 */
        $.getJSON("/getLevelList",function (d){
            if(d.code!=0){
                layer.msg(d.msg);
            }else{
                let list = d.obj;
                let s="";
                for (let i = 0; i < list.length; i++) {
                    if(obj.levelId==list[i].levelId){
                        s+='<option selected value="'+list[i].levelId+'">'+list[i].levelName+'</option>';
                    }else{
                        s+='<option value="'+list[i].levelId+'">'+list[i].levelName+'</option>';
                    }

                }
                //设置到列表位置
                $("#levelId").html(s);
                //刷新
                form.render("select");
            }
        });
        /* 行业列表 */
        $.getJSON("/getIndustryList",function (d){
            if(d.code!=0){
                layer.msg(d.msg);
            }else{
                let list = d.obj;
                let s="";
                for (let i = 0; i < list.length; i++) {
                    if(obj.industryId==list[i].industryId){
                        s+='<option selected value="'+list[i].industryId+'">'+list[i].industryName+'</option>';
                    }else{
                        s+='<option value="'+list[i].industryId+'">'+list[i].industryName+'</option>';
                    }
                }
                //设置到列表位置
                $("#industryId").html(s);
                //刷新
                form.render("select");
            }
        });

        /* 是否有效 */



        /**
         * 提交表单
         */
        form.on("submit(edit)",function (data) {
            //AJAX
            $.ajax({
                url:"/updateCustomer",
                method:"post",
                data:JSON.stringify(data.field),
                contentType:"application/json",
                success:function (d){
                    //关闭弹出层
                    let index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index); //再执行关闭
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }
                }
            });
            return false;
        });

    });

</script>
</body>
</html>
