<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>百慧智慧wms仓库</title>
  <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

	<div class="layui-container">
        <!--表格展示位置-->
        <table id="deptId" lay-filter="test"></table>
    </div>


<script src="../layui/layui.js"></script>
<script>
    //加载额外模块
    layui.extend({"treeTable":"../js/treeTable"}).use(["treeTable","jquery","layer"],function () {
        //加载树形表格模块
        let treeTable = layui.treeTable;
        let $=layui.jquery;
        let layer = layui.layer;

        //初始化数据表格
        treeTable.render({
            elem: '#deptId',
            url: '/getDepartmentList',
            toolbar: '<div><button lay-event="addDept" class="layui-btn layui-btn-sm"> <i class="layui-icon layui-icon-add-1"></i>添加一级部门</button> </div>',
            defaultToolbar: ['exports', 'print'],
            tree: {
                iconIndex: 0,
                isPidData: true,
                idName: 'deptId',
                pidName: 'parentId'
            },
            parseData:function(res){
                return {
                    "code": res.code,
                    "msg": res.msg,
                    "data": res.obj
                }
            },
            cols:[[
                    {
                        field: 'deptName',
                        title: '部门名称',
                        width: '35%'
                    },
                    {
                        field: 'level',
                        title: '层级',
                        width: '15%',
                        templet:function (d){
                            return '<span class="layui-badge layui-bg-'+(d.level==1?"blue":d.level==2?"green":"cyan")+'">'+d.level+'</span>';
                        }
                    },
                    {
                        field: 'createTime',
                        title: '创建时间'
                    },
                    {
                        field: 'updateTime',
                        title: '更新时间'
                    },
                    {
                        field: 'isDelete',
                        title: '是否有效',
                        width: '15%',
                        templet:function (d){
                            return d.isDelete==1?'<span class="layui-badge layui-bg-green">有效</span>':'<span class="layui-badge">无效</span>';
                        }
                    },
                    {
                        title: '操作',
                        templet:function (d){
                            let s='<button type="button" lay-event="del" class="layui-btn layui-btn-xs layui-btn-danger">删除</button>';
                            s+='<button type="button" lay-event="edit" class="layui-btn layui-btn-xs layui-btn-warm">更新</button>';
                            if(d.level!=3){
                                s+='<button type="button" lay-event="add" class="layui-btn layui-btn-xs layui-btn-normal">添加</button>';
                            }
                            return s;
                        }
                    }
            ]]
        });

        //列事件绑定
        treeTable.on('tool(deptId)',function (obj) {
            console.log("-->>>",obj);
            if(obj.event==="del"){
                console.log("删除...")
            }else if(obj.event==="edit"){
                console.log("编辑...")
            }else if(obj.event==="add"){
                console.log("添加...")
            }
        });

        //头部事件绑定
        treeTable.on('toolbar(deptId)',function (obj) {
            if(obj.event==="addDept"){
                layer.open({
                    type:2,
                    title:'添加部门',
                    content:'departmentAdd.html?level=1',
                    area:['500px','450px'],
                    end:function (){
                        //刷新数据表格
                        treeTable.reload("deptId");
                    }
                });
            }
        });

    });

</script>
</body>
</html>
