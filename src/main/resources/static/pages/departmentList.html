<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>百慧智慧wms仓库</title>
  <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

	<div class="layui-container">
        <!--表格展示位置-->
        <table id="deptId"></table>
    </div>


<script src="../layui/layui.js"></script>
<script>

    layui.extend({"treeTable":"../js/treeTable"}).use(["treeTable"],function () {
        //加载树形表格模块
        let treeTable = layui.treeTable;
        //初始化数据表格
        treeTable.render({
            elem: '#deptId',
            url: '/getDepartmentList',
            toolbar: true,
            tree: {
                iconIndex: 0,
                isPidData: true,
                idName: 'deptId',
                pidName: 'parentId'
            },
            parseData:function(res){
                return {
                    "code": res.code,
                    "msg": res.msg,
                    "data": res.obj
                }
            },
            style: 'margin-top:0;',
            cols:[[
                    {
                        field: 'deptName',
                        title: '部门名称'
                    },
                    {
                        field: 'level',
                        title: '级别'
                    },
                    {
                        field: 'createTime',
                        title: '创建时间'
                    },
                    {
                        field: 'updateTime',
                        title: '更新时间'
                    },
                    {
                        field: 'isDelete',
                        title: '是否有效'
                    }
            ]]
        });

    });

</script>
</body>
</html>
