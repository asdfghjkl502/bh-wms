<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百惠wms仓库</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>
<div class="layui-fluid">
    <form class="layui-form" style="margin-top: 10px;">
        <input type="hidden" name="productId" id="productId">
        <div class="layui-form-item">
            <label class="layui-form-label">产品名称</label>
            <div class="layui-input-block">
                <input type="text" id="productName" name="productName" required  lay-verify="required" placeholder="产品名称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">产品价格</label>
            <div class="layui-input-block">
                <input type="text" id="productPrice" name="productPrice" required  lay-verify="required" placeholder="产品价格" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">产品大小</label>
            <div class="layui-input-block">
                <input type="text" id="productSize" name="productSize" required  lay-verify="required" placeholder="产品大小" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">分类</label>
            <div class="layui-input-block">
                <select id="categoryId" name="categoryId" lay-verify="required"></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">是否有效</label>
            <div class="layui-input-block">
                <input type="radio" name="isDelete" value="1" title="有效" checked>
                <input type="radio" name="isDelete" value="0" title="无效">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-block">
                <input type="text" id="createTime" name="createTime"  placeholder="创建时间"  class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn  layui-btn-normal" lay-submit lay-filter="edit">更新产品</button>
            </div>
        </div>
    </form>
</div>

<script src="../layui/layui.js"></script>
<script src="../js/xm-select.js"></script>
<script>

    layui.use(["jquery","form","laydate","layer"],function () {
        let $ = layui.jquery;
        let form = layui.form;
        let laydate = layui.laydate;
        let layer = layui.layer;

        /*创建时间*/
        laydate.render({
            elem: '#createTime', //指定元素
            type:'datetime',/* 年月日时分秒 */
            theme:'#2F4056 '
        });

        /* 处理请求地址 */
        let url=location.href;
        //获取参数
        let param = url.substring(url.lastIndexOf("?")+1,url.length);
        let params = param.split("&");
        let obj={};
        for (let i = 0; i < params.length; i++) {
            let item = params[i].split("=");
            obj[item[0]]=item[1];
        }
        if(obj.isDelete==1){
            $('input[name="isDelete"][value="1"]').attr("checked","checked");
        }else{
            $('input[name="isDelete"][value="0"]').attr("checked","checked");
        }
        //刷新
        form.render("radio");


        /* 分类列表 */
        $.getJSON("/getCategoryList$",function (d){
            if(d.code!=0){
                layer.msg(d.msg);
            }else{
                let list = d.obj;
                let s="";
                for (let i = 0; i < list.length; i++) {
                    if(obj.categoryId==list[i].categoryId){
                        s+='<option selected value="'+list[i].categoryId+'">'+list[i].categoryName+'</option>';
                    }else{
                        s+='<option value="'+list[i].categoryId+'">'+list[i].categoryName+'</option>';
                    }

                }
                //设置到列表位置
                $("#categoryId").html(s);
                //刷新
                form.render("select");
            }
        });


        /* 是否有效 */



        /**
         * 提交表单
         */
        form.on("submit(edit)",function (data) {
            //AJAX
            $.ajax({
                url:"/updateProduct",
                method:"post",
                data:JSON.stringify(data.field),
                contentType:"application/json",
                success:function (d){
                    //关闭弹出层
                    let index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index); //再执行关闭
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }
                }
            });
            return false;
        });

    });

</script>
</body>
</html>
