<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百慧wms仓库</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

<div class="layui-fluid">
    <form class="layui-form" style="margin-top: 10px;">
        <input type="hidden" id="repoId" name="repoId">
        <div class="layui-form-item">
            <label class="layui-form-label">仓库地址</label>
            <div class="layui-input-block">
                <input type="text" id="repoAddress" name="repoAddress" required  lay-verify="required" placeholder="仓库地址" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">仓库面积</label>
            <div class="layui-input-block">
                <input type="text" id="repoArea" name="repoArea" required  lay-verify="required" placeholder="仓库面积 平方米" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">仓库描述</label>
            <div class="layui-input-block">
                <input type="text" id="repoDesc" name="repoDesc" required  lay-verify="required" placeholder="仓库描述" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">仓库状态</label>
            <div  class="layui-input-block">
                <select id="repoStatus" name="repoStatus" lay-verify="required"></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">是否有效</label>
            <div class="layui-input-block">
                <input type="radio" name="isDelete" value="1" title="有效">
                <input type="radio" name="isDelete" value="0" title="无效">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-block">
                <input type="text" id="createTime" name="createTime"  placeholder="创建时间"  class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn  layui-btn-normal" lay-submit lay-filter="edit">更新仓库</button>
            </div>
        </div>
    </form>
</div>

<script src="../layui/layui.js"></script>
<script src="../js/xm-select.js"></script>
<script>

    layui.use(["jquery","form","laydate","layer"],function () {
        let $ = layui.jquery;
        let form = layui.form;
        let laydate = layui.laydate;
        let layer = layui.layer;

        /*创建时间*/
        laydate.render({
            elem: '#createTime', //指定元素
            type:'datetime',/* 年月日时分秒 */
            theme:'#2F4056 '
        });

        /*获取地址参数*/
        let url = location.href;
        let param = url.substring(url.lastIndexOf("?")+1,url.length);
        let ps = param.split("&");
        let obj={};
        for (let i=0;i<ps.length;i++){
            let pl = ps[i].split("=");
            obj[pl[0]]=pl[1];
        }

        /* 单选框回显 */
        if(obj.isDelete==1){
            $('input[name="isDelete"][value="1"]').attr("checked","checked");
        }else{
            $('input[name="isDelete"][value="0"]').attr("checked","checked");
        }
        //刷新
        form.render("radio");

        /* 状态列表 */
        $.getJSON("/getRepositoryStatusList",function (d){
            if(d.code!=0){
                layer.msg(d.msg);
            }else{
                let list = d.obj;
                let s="";
                for (let i = 0; i < list.length; i++) {
                    if(list[i].repoStatusId==obj.repoStatus){
                        s+='<option selected value="'+list[i].repoStatusId+'">'+list[i].repoStatusName+'</option>';
                    }else{
                        s+='<option value="'+list[i].repoStatusId+'">'+list[i].repoStatusName+'</option>';
                    }
                }
                //设置到列表位置
                $("#repoStatus").html(s);
                //刷新
                form.render("select");
            }
        });


        /**
         * 提交表单
         */
        form.on("submit(edit)",function (data) {
            //AJAX
            $.ajax({
                url:"/updateRepository",
                method:"post",
                data:JSON.stringify(data.field),
                contentType:"application/json",
                success:function (d){
                    //关闭弹出层
                    let index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index); //再执行关闭
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }
                }
            });
            return false;
        });

    });

</script>
</body>
</html>
