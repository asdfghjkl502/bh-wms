<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百慧wms仓库</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

<div class="layui-fluid">
    <form class="layui-form" style="margin-top: 10px;">
        <div class="layui-form-item">
            <label class="layui-form-label">角色名</label>
            <div class="layui-input-block">
                <input type="text" name="roleName" required  lay-verify="required" placeholder="角色名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">是否有效</label>
            <div class="layui-input-block">
                <input type="radio" name="isDelete" value="1" title="有效" checked>
                <input type="radio" name="isDelete" value="0" title="无效">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-block">
                <input type="text" id="createTime" name="createTime"  placeholder="创建时间"  class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">分配权限</label>
            <div class="layui-input-block">
                <div id="permissionSelect" style="width: 100%;"></div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn  layui-btn-normal" lay-submit lay-filter="add">添加角色</button>
            </div>
        </div>
    </form>
</div>

<script src="../layui/layui.js"></script>
<script src="../js/xm-select.js"></script>
<script>

    let permissionSelect;

    layui.use(["jquery","form","laydate","layer"],function () {
        let $ = layui.jquery;
        let form = layui.form;
        let laydate = layui.laydate;
        let layer = layui.layer;

        // 延迟初始化权限下拉框，避免刷新时一闪而过
        setTimeout(function(){
            permissionSelect = xmSelect.render({
                el: "#permissionSelect",
                filterable: true,
                remoteSearch: true,
                tips: "选择权限",
                searchTips: "搜索权限",
                maxHeight: 120,
                prop: {
                    name: "permissionName",
                    value: "permissionId"
                },
                theme: {
                    color: '#0081ff',
                },
                remoteMethod: function(val, cb, show){
                    if(!val){
                        $.getJSON("/getPermissionAll",function (d) {
                            if(d.code!==0){
                                layer.msg(d.msg);
                            }else{
                                cb(d.obj);
                            }
                        });
                    }else{
                        $.getJSON("/getPermissionAll",function (d) {
                            if(d.code!==0){
                                layer.msg(d.msg);
                            }else{
                                // 本地过滤
                                let filtered = d.obj.filter(function(item) {
                                    return item.permissionName.indexOf(val) !== -1 || item.permissionCode.indexOf(val) !== -1;
                                });
                                cb(filtered);
                            }
                        });
                    }
                }
            });
        }, 100);

        laydate.render({
            elem: '#createTime',
            type:'datetime',
            theme:'#2F4056 '
        });

        /**
         * 提交表单
         */
        form.on("submit(add)",function (data) {
            let role = {
                roleName: data.field.roleName,
                isDelete: data.field.isDelete,
                createTime: data.field.createTime || new Date()
            };

            let selectedPermissions = permissionSelect.getValue();
            let permissionIds = selectedPermissions.map(function(item) {
                return item.permissionId;
            });

            let params = {
                role: role,
                permissionIds: permissionIds
            };

            //AJAX
            $.ajax({
                url:"/addRoleWithPermissions",
                method:"post",
                data:JSON.stringify(params),
                contentType:"application/json",
                success:function (d){
                    //关闭弹出层
                    let index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    if(d.code!==0){
                        layer.msg(d.msg);
                    }
                }
            });
            return false;
        });

    });

</script>
</body>
</html>
