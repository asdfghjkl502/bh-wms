<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>百慧智慧wms仓库</title>
  <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

    <div class="layui-fluid">
        <!-- 条件搜索 -->
        <div class="layui-row">
            <h1>条件展示</h1>
        </div>
        <!-- 数据表格展示 -->
        <div class="layui-row">
            <table id="demo" lay-filter="test"></table>
        </div>
    </div>




<script src="../layui/layui.js"></script>
<script>
    layui.use(["table","laydate","form","layer","jquery"],function(){
        const table = layui.table;
        const laydate = layui.laydate;
        const form = layui.form;
        const layer = layui.layer;
        const $ = layui.jquery;

        /**
         * 表格头部事件绑定
         */
        table.on('toolbar(test)',function (obj){
            //获取事件名
            let e = obj.event;
            if(e==="batchDel"){
                layer.confirm("是否删除",function (index){
                    //关闭弹出层
                    layer.close(index);
                    //获取选中行数据
                    let batchParam = table.checkStatus("demo");
                    console.log("->>",batchParam);
                    //构建参数
                    let roleIds=[];
                    let list=batchParam.data;
                    for (let i = 0; i < list.length; i++) {
                        roleIds.push(list[i].roleId);
                    }
                    $.ajax({
                        url:"/batchDeleteRole",
                        method:"post",
                        data:JSON.stringify(roleIds),
                        contentType:"application/json",
                        success:function (d){
                            if(d.code===0){
                                //刷新表格
                                table.reload("demo");
                            }else{
                                layer.msg(d.msg);
                            }
                        }
                    });
                });
            }else if(e==="addRole"){
                layer.open({
                    type:2,
                    title:'添加角色',
                    content:'roleAdd.html',
                    area:['500px','400px'],
                    end:function (){
                        //刷新数据表格
                        table.reload("demo");
                    }
                });
            }
        });


        /*
            数据表格展示
        */
        table.render({
            elem:"#demo",
            url:"/getRolePage",
            page:{
                prev:'上一页',
                next:'下一页'
            },
            limit:5,
            limits:[5,10,15,20,25],
            request:{
                pageName: 'pageNo',
                limitName:'pageSize'
            },
            parseData:function(res){
                return {
                    "code": res.code,
                    "msg": res.msg,
                    "count": res.obj.count,
                    "data": res.obj.data
                }
            },
            toolbar: '<div> <button lay-event="batchDel" class="layui-btn layui-btn-sm layui-btn-danger"> <i class="layui-icon layui-icon-delete"></i> 批量删除</button><button lay-event="addRole" class="layui-btn layui-btn-sm layui-btn-normal"> <i class="layui-icon layui-icon-add-1"></i>添加</button> </div>',
            defaultToolbar: ['exports', 'print'],
            cols:[
                [
                    {
                        checkbox: true
                    },
                    {
                        title: '序号',
                        type:'numbers',
                        width:'10%'
                    },
                    {
                        field: 'roleName',
                        title: '角色名称',
                        sort: true
                    },
                    {
                        field: 'createTime',
                        title: '创建时间',
                        sort: true
                    },
                    {
                        field: 'updateTime',
                        title: '更新时间',
                        sort: true
                    },
                    {
                        field: 'isDelete',
                        title: '是否有效',
                        templet:function (d) {
                            return d.isDelete===1?'<span class="layui-badge layui-bg-green">有效</span>':'<span class="layui-badge layui-bg-orange">无效</span>';
                        }
                    },
                    {
                        title: '操作',
                        templet:function (d) {
                            let s="<button type='button' lay-event='del' class='layui-btn layui-btn-danger layui-btn-xs'>删除</button>";
                            s+="<button type='button' lay-event='edit' class='layui-btn layui-btn-warm layui-btn-xs'>更新</button>";
                            return s;
                        }
                    }
                ]
            ]
        });




    });
</script>
</body>
</html>
