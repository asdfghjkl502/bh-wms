<div class="panel panel-default">
  <div class="panel-heading wel-head">
  	  <span>角色管理</span>
  	  <span class="currentTime"></span>
  </div>
  <div class="panel-body">
    <table id="table"></table>
  </div>
</div>
<script>
    //1. 获取table的JQuery对象
    var $table=$("#table");
    //2. 调用bootstrapTable函数
    $table.bootstrapTable({
        url:"http://localhost:8080/getRoles",
        /* 开启分页 */
        pagination:true,
        /* 从服务端获取数据,如果不设置分页不会生效 */
        sidePagination:"server",
        /* 上一页设置 */
        paginationPreText:"上一页",
        /* 下一页设置 */
        paginationNextText:"下一页",
        /*响应数据处理*/
        responseHandler:function(res){
            return{
                rows:res.obj.data,
                total:res.obj.count
            }
        },
        /* 分页列表 */
        pageList:[5,10,15,20,25],
        /*默认当前页*/
        pageNumber:1,
        /* 每页显示多少条数 */
        pageSize:5,
        // 自定义表的列
        columns:[
            {
                // 自定义列名称
                title:'角色ID',
                // 后台JSON数据中对应的属性名
                field:'roleId'
            },
            {
                title:'角色名称',
                field:'roleName'
            },
            {
                title:'创建时间',
                field:'createTime'
            },
            {
                title:'更新时间',
                field:'updateTime'
            },
            {
                title:'是否删除',
                field:'isDelete',
                formatter:function (value,row,index,field) {
                    let s="<span class=\"label label-success\">"+(value==1?'有效':'无效')+"</span>";
                    return s;
                }

            }
        ]
    });

</script>
