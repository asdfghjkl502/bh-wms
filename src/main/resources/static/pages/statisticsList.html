<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>百慧智慧wms仓库</title>
  <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>
    <div class="layui-container">

        <!-- 月入库产品数量,柱状图 -->
        <div class="layui-row">
            <div id="prodIn" style="width: 100%;height:400px;"></div>
        </div>
        <!-- 月出库产品数量,柱状图 -->
        <div class="layui-row">
            <div id="prodOut" style="width: 100%;height:400px;"></div>
        </div>
        <!-- 月入库/出库金额,折线图 -->
        <div class="layui-row">
            <div id="prodMoney" style="width: 100%;height:400px;"></div>
        </div>
    </div>
    <script src="../layui/layui.js"></script>
    <script src="../js/echarts.js"></script>

    <script>

        layui.use(["jquery","layer"],function () {

            /*获取jquery实例对象*/
            let $ = layui.jquery;
            let layer = layui.layer;

            /*月入库产品数量,柱状图*/
            $.getJSON("/getStatisticsInMonth",function (d) {
                console.log("--->>>>>>",d);
                if(d.code===0){
                    let prodIn = echarts.init(document.getElementById('prodIn'));
                    prodIn.setOption({
                        title: {
                            text: '月入库量'
                        },
                        tooltip: {},
                        legend: {
                            data: ['入库增长量']
                        },
                        xAxis: {
                            data: d.obj.times
                        },
                        yAxis: {},
                        series: [
                            {
                                name: '销量',
                                type: 'bar',
                                data: d.obj.counts
                            }
                        ]
                    });
                }else{
                    layer.msg(d.msg);
                }

            });


            /*月出库产品数量,柱状图*/
            var prodOut = echarts.init(document.getElementById('prodOut'));
            prodOut.setOption({
                title: {
                    text: '月出库量'
                },
                xAxis: {
                    type: 'category',
                    data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
                },
                yAxis: {
                    type: 'value'
                },
                series: [
                    {
                        data: [
                            120,
                            {
                                value: 200,
                                itemStyle: {
                                    color: '#a90000'
                                }
                            },
                            150,
                            80,
                            70,
                            110,
                            130
                        ],
                        type: 'bar'
                    }
                ]
            });
            /*月入库/出库金额,折线图*/
            var prodMoney = echarts.init(document.getElementById('prodMoney'));
            prodMoney.setOption( {
                title: {
                    text: '月出入库金额'
                },
                tooltip: {
                    trigger: 'axis'
                },
                legend: {
                    data: ['Email', 'Union Ads', 'Video Ads', 'Direct', 'Search Engine']
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
                },
                yAxis: {
                    type: 'value'
                },
                series: [
                    {
                        name: 'Email',
                        type: 'line',
                        stack: 'Total',
                        data: [120, 132, 101, 134, 90, 230, 210]
                    },
                    {
                        name: 'Union Ads',
                        type: 'line',
                        stack: 'Total',
                        data: [220, 182, 191, 234, 290, 330, 310]
                    },
                    {
                        name: 'Video Ads',
                        type: 'line',
                        stack: 'Total',
                        data: [150, 232, 201, 154, 190, 330, 410]
                    },
                    {
                        name: 'Direct',
                        type: 'line',
                        stack: 'Total',
                        data: [320, 332, 301, 334, 390, 330, 320]
                    },
                    {
                        name: 'Search Engine',
                        type: 'line',
                        stack: 'Total',
                        data: [820, 932, 901, 934, 1290, 1330, 1320]
                    }
                ]
            });

        });


    </script>

</body>
</html>
