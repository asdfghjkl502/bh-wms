<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百慧wms仓库</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

<div class="layui-fluid">
    <form class="layui-form" style="margin-top: 10px;">
        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
                <input type="text" name="userName" required  lay-verify="required" placeholder="用户名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" name="userTel" required  lay-verify="required" placeholder="手机号" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input type="email" name="userEmail" required  lay-verify="required" placeholder="邮箱" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-block">
                <input type="text" name="userNick" required  lay-verify="required" placeholder="昵称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">部门</label>
            <div class="layui-input-block" id="deptId">

            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">角色</label>
            <div id="role" class="layui-input-block"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input type="password" name="password" required  lay-verify="required" placeholder="密码" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">是否有效</label>
            <div class="layui-input-block">
                <input type="radio" name="isDelete" value="1" title="有效" checked>
                <input type="radio" name="isDelete" value="0" title="无效">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-block">
                <input type="text" id="createTime" name="createTime"  placeholder="创建时间"  class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn  layui-btn-normal" lay-submit lay-filter="add">添加用户</button>
            </div>
        </div>
    </form>
</div>

<script src="../layui/layui.js"></script>
<script src="../js/xm-select.js"></script>
<script>

    layui.use(["jquery","form","laydate"],function () {
        let $ = layui.jquery;
        let form = layui.form;
        let laydate = layui.laydate;
        let layer = layui.layer;

        /*创建时间*/
        laydate.render({
            elem: '#createTime', //指定元素
            type:'datetime',/* 年月日时分秒 */
            theme:'#2F4056 '
        });

        /* 部门列表 */
        $.getJSON("/getDepartmentList$",function (d) {
            if(d.code===0){
                xmSelect.render({
                    el:"#deptId",
                    name:"deptId",
                    tree:{
                        //是否显示树状结构
                        show: true,
                        //是否展示三角图标
                        showFolderIcon: true,
                        //是否显示虚线
                        showLine: false,
                        //间距
                        indent: 20,
                        //默认节点展开
                        expandedKeys:true
                    },
                    prop:{
                        name:'deptName',
                        value:'deptId'
                    },
                    data: function(){
                        return d.obj;
                    }
                });
            }else{
                //出错
                layer.msg(d.msg);
            }
        });

        /* 角色列表 */
        $.getJSON("/getRoleList",function(d){
            if(d.code===0){
                //处理列表
                xmSelect.render({
                    el:"#role",
                    name:"roleId",
                    theme: {
                        color: '#0081ff',
                    },
                    prop:{
                        name:'roleName',
                        value:'roleId'
                    },
                    data:d.obj
                });
            }else{
                //出错
                layer.msg(d.msg);
            }
        });

        /**
         * 提交表单
         */
        form.on("submit(add)",function (data) {

            //参数处理(处理角色)
            let param = data.field;
            let roleIds = param.roleId!=""||param.roleId!=null?param.roleId.split(","):[];
            param.roleId=roleIds;
            //参数处理(处理部门)
            let deptIds = param.deptId!=""||param.deptId!=null?param.deptId.split(","):[];
            param.deptId=deptIds;
            console.log("===>",param);
            //AJAX
            /*$.ajax({
                url:"/addUser",
                method:"post",
                data:JSON.stringify(data.field),
                contentType:"application/json",
                success:function (d){
                    //关闭弹出层
                    let index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index); //再执行关闭
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }
                }
            });*/
            return false;
        });

    });

</script>
</body>
</html>
