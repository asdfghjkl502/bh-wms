<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百慧wms仓库</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
    <link href="../css/hxx.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/hxx-user.css">
</head>
<body>

<div class="layui-fluid">
    <!--  条件选项  -->
    <form class="layui-form layui-row user-search">
        <!--  用户名称  -->
        <div class="user">
            <label for="userName">姓名:</label>
            <input id="userName" name="userName" placeholder="请输入姓名...">
        </div>
        <!--  手机号  -->
        <div class="user">
            <label for="phone">手机:</label>
            <input id="phone" name="userTel" placeholder="请输入手机号...">
        </div>
        <!--  开始时间  -->
        <div class="user">
            <label for="start">开始时间:</label>
            <input id="start" name="startTime" placeholder="起始时间">
        </div>
        <!--  结束时间  -->
        <div class="user">
            <label for="end">结束时间:</label>
            <input id="end" name="endTime" placeholder="结束时间">
        </div>
        <!--提交按钮-->
        <div class="user">
            <button type="button" lay-submit lay-filter="search" class="layui-btn  layui-btn-primary layui-border-green">搜索</button>
            <button type="reset" class="layui-btn  layui-btn-primary layui-border-red">重置</button>
        </div>
    </form>
    <table id="demo" lay-filter="test"></table>
</div>

<script src="../layui/layui.js"></script>
<script src="../js/hxx.js"></script>
<script>

    layui.use(["table","laydate","form","layer","jquery"],function(){
        const table = layui.table;
        const laydate = layui.laydate;
        const form = layui.form;
        const layer = layui.layer;
        const $ = layui.jquery;

        /* 时间控件选择 */
        /*
            开始时间
         */
        laydate.render({
            elem: '#start', //指定元素
            type:'datetime',/* 年月日时分秒 */
            theme:'#2F4056 '
        });
        /*
            结束时间
         */
        laydate.render({
            elem: '#end', //指定元素
            type:'datetime',/* 年月日时分秒 */
            theme:'#2F4056 '
        });

        table.render({
            elem:"#demo",
            url:"/getUserPage",
            page:{
                prev:'上一页',
                next:'下一页'
            },
            limit:5,
            limits:[5,10,15,20,25],
            request:{
                pageName: 'pageNo',
                limitName:'pageSize'
            },
            parseData:function(res){
                return {
                    "code": res.code,
                    "msg": res.msg,
                    "count": res.obj.count,
                    "data": res.obj.data
                }
            },
            toolbar: '<div> <button lay-event="batchDel" class="layui-btn layui-btn-sm layui-btn-danger"> <i class="layui-icon layui-icon-delete"></i> 批量删除</button><button lay-event="addUser" class="layui-btn layui-btn-sm layui-btn-normal"> <i class="layui-icon layui-icon-add-1"></i>添加</button> </div>',
            defaultToolbar: ['exports', 'print'],
            cols:[
                [
                    {
                        checkbox: true
                    },
                    {
                        title: '序号',
                        type:'numbers',
                        width:'10%'
                    },
                    {
                        field: 'userName',
                        title: '姓名',
                        sort: true
                    },
                    {
                        field: 'userTel',
                        title: '手机'
                    },
                    {
                        field: 'createTime',
                        title: '创建时间',
                        sort: true,
                        width:'18%'
                    },
                    {
                        field: 'updateTime',
                        title: '更新时间',
                        sort: true,
                        width:'18%'
                    },
                    {
                        field: 'isDelete',
                        title: '是否有效',
                        templet:function (d) {
                            if(d.isDelete===1){
                                let s='<input style="width: 50%;" lay-filter="isDel" type="checkbox" name="isDelete" value="'+d.userId+'" lay-skin="switch" lay-text="有效|无效" checked>';
                                return s;
                            }else{
                                let s='<input style="width: 50%;" lay-filter="isDel" type="checkbox" name="isDelete" value="'+d.userId+'" lay-skin="switch" lay-text="有效|无效">';
                                return s;
                            }
                        },
                        exportTemplet:function(d,obj){
                            return d.isDelete===0?'无效':'有效';
                        }
                    },
                    {
                        title: '操作',
                        templet:function (d) {
                            var s="<button type='button' lay-event='detail' class='layui-btn layui-btn-normal layui-btn-xs'>详情</button>";
                            s+="<button type='button' lay-event='edit' class='layui-btn layui-btn-danger layui-btn-xs'>更新</button>";
                            return s;
                        }
                    }
                ]
            ]
        });
        /**
         * 表格头部事件绑定
         */
        table.on('toolbar(test)',function (obj){
           //获取事件名
           let e = obj.event;
            if(e=='batchDel'){
                layer.confirm("是否删除",function (index){
                    layer.close(index);
                    //获取选中的行数据
                    let batchParam = table.checkStatus("demo");
                    //调用AJAX删除数据
                    let userIds=[];
                    let list=batchParam.data;
                    for (let i = 0; i < list.length; i++) {
                        userIds.push(list[i].userId);
                    }
                    $.ajax({
                        url:"/batchDeleteUser",
                        method:"post",
                        data:JSON.stringify(userIds),
                        contentType:"application/json",
                        success:function (d){
                            if(d.code===0){
                                //刷新表格
                                table.reload("demo");
                            }else{
                                layer.msg(d.msg);
                            }
                        }
                    });
                });
            }else if(e=='addUser'){
                layer.open({
                    type:2,
                    title:'添加用户',
                    content:'userAdd.html',
                    area:['500px','450px'],
                    end:function (){
                        //刷新数据表格
                        table.reload("demo");
                    }
                });
            }
        });
        /**
         * 单元格事件绑定
         */
        table.on("tool(test)",function (obj){
            //获取事件名
            let e = obj.event;
            if(e=='detail'){
                layer.open({
                    type:2,
                    title:'详情',
                    content:'userDetail.html',
                    area:['500px','450px'],
                    end:function (){

                    }
                });
            }else if(e=='edit'){
                layer.open({
                    type:2,
                    title:'更新用户',
                    content:'userUpdate.html?isDelete='+obj.data.isDelete,
                    area:['500px','450px'],
                    success: function(layero, index){
                        //弹出执行
                        let body = layer.getChildFrame('body', index);//获取弹出层中body标签的DOM对象
                        //给弹出层表单回显
                        body.find('#userId').val(obj.data.userId);
                        body.find('#userName').val(obj.data.userName);
                        body.find('#userTel').val(obj.data.userTel);
                        body.find('#userEmail').val(obj.data.userEmail);
                        body.find('#password').val(obj.data.password);
                        body.find('#userNick').val(obj.data.userNick);
                        body.find('#createTime').val(obj.data.createTime);
                    },
                    end:function (){
                        //弹出层销毁之后执行
                        //刷新数据表格
                        table.reload("demo");
                    }
                });
            }
        });
        /**
         * 开关事件
         */
        form.on("switch(isDel)",function (obj){
            let param={};
            param.isDelete=obj.elem.checked==true?1:0;
            param.userId=obj.value;
            $.ajax({
                url:"/updateUser",
                method:"post",
                data:JSON.stringify(param),
                contentType:"application/json",
                success:function (d){
                    if(d.code===0){
                        //刷新表格
                        table.reload("demo");
                    }else{
                        layer.msg(d.msg);
                    }
                }
            });
        });
        /**
         * 搜索事件绑定
         */
        form.on("submit(search)",function (obj){
            //重新获取数据表格首页数据(根据搜索条件查询出来的数据)
            table.reload("demo",{
                page:{
                    curr:1
                },
                where:{
                    userName:obj.field.userName,
                    userTel:obj.field.userTel,
                    startTime:obj.field.startTime,
                    endTime:obj.field.endTime
                }
            })
        });


    });

</script>
</body>
</html>
