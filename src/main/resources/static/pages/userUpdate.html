<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百慧wms仓库</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>

<div class="layui-fluid">
    <form class="layui-form" style="margin-top: 10px;">
        <input type="hidden" id="userId" name="userId">
        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
                <input type="text" id="userName" name="userName" required  lay-verify="required" placeholder="用户名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" id="userTel" name="userTel" required  lay-verify="required" placeholder="手机号" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input type="email" id="userEmail" name="userEmail" required  lay-verify="required" placeholder="邮箱" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-block">
                <input type="text" id="userNick" name="userNick" required  lay-verify="required" placeholder="昵称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input type="password" id="password" name="password" required  lay-verify="required" placeholder="密码" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">是否有效</label>
            <div class="layui-input-block">
                <input type="radio" name="isDelete" value="1" title="有效">
                <input type="radio" name="isDelete" value="0" title="无效">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-block">
                <input type="text" id="createTime" name="createTime"  placeholder="创建时间"  class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn  layui-btn-normal" lay-submit lay-filter="update">更新用户</button>
            </div>
        </div>
    </form>
</div>

<script src="../layui/layui.js"></script>
<script>

    layui.use(["jquery","form","laydate","layer"],function () {
        let $ = layui.jquery;
        let form = layui.form;
        let laydate = layui.laydate;
        let layer = layui.layer;

        //获取参数
        let url = location.href;
        url = url.substring(url.lastIndexOf("?")+1,url.length);
        //表单回显(性别)
        if(url.split("=")[1]==1){
            //有效
            $('input[name="isDelete"][value="1"]').attr("checked","checked");
        }else{
            //无效
            $('input[name="isDelete"][value="0"]').attr("checked","checked");
        }
        //刷新
        form.render("radio");
        //时间选择
        laydate.render({
            elem: '#createTime', //指定元素
            type:'datetime',/* 年月日时分秒 */
            theme:'#2F4056 '
        });

        /**
         * 提交表单
         */
        form.on("submit(update)",function (data) {
            //AJAX
            $.ajax({
                url:"/updateUser",
                method:"post",
                data:JSON.stringify(data.field),
                contentType:"application/json",
                success:function (d){
                    //关闭弹出层
                    let index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index); //再执行关闭
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }
                }
            });
            return false;
        });

    });

</script>
</body>
</html>
