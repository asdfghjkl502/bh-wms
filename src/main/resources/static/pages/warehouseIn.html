<script src="../layui/layui.js"></script>
<script src="../js/xm-select.js"></script>
<script>

    layui.use(["jquery","form","laydate","layer"],function () {

        let $ = layui.jquery;
        let form = layui.form;
        let layer = layui.layer;

        //生成供应商下拉框
        xmSelect.render({
            el:"#supplierId",
            filterable: true,/*开启搜索模式*/
            remoteSearch: true, /* 开启远程搜索 */
            max: 1, /* 选择一条 */
            tips:"供应商名称",/* 背景提示 */
            searchTips:"搜索供应商",/*搜索提示*/
            prop:{  /*修改下拉框默认属性*/
                name:"supplierName",
                value:"supplierId"
            },
            theme: { /*主题*/
                color: '#0081ff',
            },
            remoteMethod: function(val, cb, show){
                //这里如果val为空, 则不触发搜索
                if(!val){
                    return cb([]);
                }
                /* 通过API获取数据 */
                $.getJSON("/getSupplierList",{supplierName:val},function (d) {
                    console.log("d:",d);
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }else{
                        cb(d.obj);
                    }
                });
            }
        });

        //生成产品下拉框
        xmSelect.render({
            el:"#productId",
            filterable: true,/*开启搜索模式*/
            remoteSearch: true, /* 开启远程搜索 */
            max: 1, /* 选择一条 */
            tips:"货物名称",/* 修改背景提示 */
            searchTips:"搜索货物名",/*搜索提示*/
            prop:{  /*修改下拉框默认属性*/
                name:"productName",
                value:"productId"
            },
            theme: { /*主题*/
                color: '#0081ff',
            },
            remoteMethod: function(val, cb, show){
                //这里如果val为空, 则不触发搜索
                if(!val){
                    return cb([]);
                }
                /* 通过API获取数据 */
                $.getJSON("/getProductList",{productName:val},function (d) {
                    console.log("d:",d);
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }else{
                        cb(d.obj);
                    }
                });
            }
        });
    });
</script>
