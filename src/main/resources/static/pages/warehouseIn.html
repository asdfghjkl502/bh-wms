<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>百慧智慧wms仓库</title>
  <link href="../layui/css/layui.css" rel="stylesheet">
</head>
<body>
    <div class="layui-container">
        <!-- 条件搜索 -->
        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-row">
                    <div class="layui-col-md8 hxx-supplier">
                        <!--供应商，带搜索框的下拉-->
                        <div class="layui-row">
                            <div class="layui-form-item">
                                <label class="layui-form-label">供应商</label>
                                <div class="layui-input-block" id="supplierId">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-row">
                    <div class="layui-col-md8 hxx-product">
                        <!--商品编号，带搜索框的下拉-->
                        <div class="layui-row">
                            <div class="layui-form-item">
                                <label class="layui-form-label">商品编号</label>
                                <div class="layui-input-block" id="product">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 信息展示,展示和隐藏 -->
        <div class="layui-fluid">
            <div class="layui-row">
                <div class="layui-col-md6">
                    <!--供应商详情-->
                </div>
                <div class="layui-col-md6">
                    <!--商品详情-->
                </div>
            </div>
        </div>
        <!-- 入库的仓库 -->
        <div class="layui-row">
            <!-- 下拉列表 -->
            <div class="layui-col-md6">

            </div>
        </div>
        <!-- 入库数量 -->
        <div class="layui-row">
            <!-- 左侧输入框,右侧显示当前库存 -->
        </div>
        <!-- 提交按钮 -->
        <div class="layui-row">
            <div class="layui-col-md12">
                <!--按钮靠最右侧,整行显示面板状态-->
            </div>
        </div>
    </div>


<script src="../layui/layui.js"></script>
<script src="../js/xm-select.js"></script>
<script>

    layui.use(["jquery","form","laydate","layer"],function () {

        let $ = layui.jquery;
        let form = layui.form;
        let layer = layui.layer;

        //生成供应商下拉框
        xmSelect.render({
            el:"#supplierId",
            filterable: true,/*开启搜索模式*/
            remoteSearch: true, /* 开启远程搜索 */
            max: 1, /* 选择一条 */
            prop:{  /*修改下拉框默认属性*/
                name:"supplierName",
                value:"supplierId"
            },
            theme: { /*主题*/
                color: '#0081ff',
            },
            remoteMethod: function(val, cb, show){
                //这里如果val为空, 则不触发搜索
                if(!val){
                    return cb([]);
                }
                /* 通过API获取数据 */
                $.getJSON("/getSupplierList",{supplierName:val},function (d) {
                    console.log("d:",d);
                    if(d.code!=0){
                        layer.msg(d.msg);
                    }else{
                        cb(d.obj);
                    }
                });
            }
        });

    });

</script>
</body>
</html>
